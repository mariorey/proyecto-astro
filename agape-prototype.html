<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agape — Ana Burjack</title>
    <meta property="og:title" content="Ana Burjack | UX/UI Designer">
    <meta property="og:description" content="Diseño de experiencias digitales intuitivas y funcionales.">

    <meta property="og:image" content="https://anaburjack.es/files/logo.png">
    <link rel="icon" type="image/x-icon" href="files/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&family=Outfit:wght@300;400&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --cream: #f2ede6;
            --black: #111010;
            --gray:  #999390;
            --mid:   #d4cfc8;
        }

        html, body {
            min-height: 100vh;
            background: white;
            color: var(--black);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* NAV */
        nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 100;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.6rem 8rem;
            background: white;
        }

        .flex-center {
            display: flex;
            align-content: center;
            justify-content: center;
            margin-top: -26px;
            margin-bottom: 16px;
        }

        .nav-logo {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            text-decoration: none;
        }

        .nav-logo-name {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--black);
            letter-spacing: 0.01em;
        }

        .nav-logo-role {
            font-size: 0.8rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gray);
        }

        .nav-center {
            display: flex;
            gap: 2.8rem;
            list-style: none;
            justify-content: center;
        }

        .nav-center a {
            position: relative;
            font-size: 1rem;
            letter-spacing: 0.05em;
            color: var(--black);
            text-decoration: none;
        }

        .nav-center a::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: var(--black);
            transition: width 0.3s ease;
        }

        .nav-center a:hover::after { width: 100%; }
        .nav-center a.active::after { width: 100%; }

        .nav-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .nav-right a svg { transition: transform 0.3s ease; }
        .nav-right a:hover svg { transform: rotate(5deg); }

        /* FOOTER */
        footer {
            border-top: 1px solid var(--black);
            padding: 1.8rem 8rem;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer p {
            font-size: 0.82rem;
            font-weight: 300;
            color: var(--black);
        }

        footer a {
            color: var(--black);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        footer .footer-inner > a {
            text-decoration: none;
            transition: transform 0.3s ease;
            display: flex;
        }

        footer .footer-inner > a:hover { transform: rotate(10deg); }

        /* PROJECT HERO */
        .project-hero {
            padding: 10rem 8rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 2rem;
        }

        .project-hero-tag {
            display: inline-block;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gray);
            border: 1px solid var(--mid);
            border-radius: 999px;
            padding: 0.35rem 1rem;
        }

        .project-hero-title {
            font-size: clamp(1.6rem, 3vw, 2.5rem);
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.02em;
            max-width: 18ch;
        }

        .project-hero-subtitle {
            font-size: clamp(1.2rem, 2vw, 1.2rem);
            font-weight: 300;
            margin-top: -25px;
        }

        .project-hero-img {
            width: 63%;
            margin-top: 1rem;
        }

        .project-hero-img img,
        .project-hero-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            border-radius: 8px;
        }

        .project-overview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            padding: 4rem 8rem;
        }

        .overview-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 900;
            line-height: 1.15;
        }

        .overview-text {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .overview-text p {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--gray);
        }

        .project-meta {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 2rem;
            padding: 3rem 8rem;
            border-top: 1px solid var(--mid);
            border-bottom: 1px solid var(--mid);
        }

        .meta-label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 1rem;
        }

        .meta-item p {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.7;
            color: var(--black);
        }

        .project-challenge {
            display: flex;
            flex-direction: column;
            gap: 4rem;
            padding: 6rem 8rem;
            border-top: 1px solid var(--mid);
        }

        .challenge-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }

        .challenge-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.3rem, 2vw, 1.7rem);
            font-weight: 900;
            line-height: 1.3;
            margin-top: 1rem;
        }

        .project-section-text ul {
            padding-left: 1.5rem;
        }

        .challenge-text {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--gray);
            padding-top: 2rem;
        }

        .project-process {
            padding: 6rem 8rem;
            border-top: 1px solid var(--mid);
            display: grid;
            grid-template-rows: auto auto;
            gap: 2rem 4rem;
            align-items: start;
        }

        .process-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            font-weight: 900;
            line-height: 1.15;
        }

        .process-visual {
            grid-column: 1 / -1;
        }

        .process-visual img,
        .process-placeholder {
            width: 100%;
            object-fit: cover;
            border-radius: 8px;
            background: var(--mid);
        }

        .process-desc {
            grid-column: 1 / -1;
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--gray);
        }

        .project-section {
            padding: 6rem 8rem;
            border-top: 1px solid var(--mid);
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .project-section-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .project-section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1;
        }

        .project-section-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: start;
        }


        .project-section-body1 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .project-section-text {
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--gray);
        }

        .project-section-img img,
        .project-section-placeholder {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            border-radius: 8px;
        }

        .three-cols {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 3rem;
        }

        .three-col-item {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .project-quote {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 8;
            font-style: italic;
            line-height: 1.2;
            color: var(--black);
        }

        .contact-btn {
            position: relative;
            z-index: 1;
            display: inline-block;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--black);
            text-decoration: none;
            border: 1px solid var(--black);
            border-radius: 999px;
            padding: 0.85rem 2.2rem;
            transition: background 0.25s, color 0.25s;
        }

        .contact-btn:hover {
            background: var(--black);
            color: white;
        }

        .three-col-item p {
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.8;
            color: var(--gray);
        }

        .nav-burger {
            display: none;
            background: none;
            border: none;
            width: 42px;
            height: 42px;
            position: relative;
            cursor: pointer;
            padding: 0;
            z-index: 101;
        }

        /* Líneas del burger */
        .nav-burger span {
            position: absolute;
            left: 9px;
            width: 24px;
            height: 1.5px;
            background: var(--black);
            transition:
                    transform 0.45s cubic-bezier(.77,0,.18,1),
                    opacity 0.25s ease,
                    top 0.45s cubic-bezier(.77,0,.18,1);
        }

        .nav-burger span:nth-child(1) { top: 14px; }
        .nav-burger span:nth-child(2) { top: 20px; }
        .nav-burger span:nth-child(3) { top: 26px; }

        /* Animación a X */
        .nav-burger.active span:nth-child(1) {
            top: 20px;
            transform: rotate(45deg);
        }

        .nav-burger.active span:nth-child(2) {
            opacity: 0;
        }

        .nav-burger.active span:nth-child(3) {
            top: 20px;
            transform: rotate(-45deg);
        }

        @media (max-width: 820px) {
            .nav-burger {
                display: block;
            }

            .nav-center {
                display: flex; /* importante */
                flex-direction: column;
                align-items: center;
                gap: 1.4rem;

                position: fixed;
                top: 85px;
                left: 0rem;
                right: 0rem;

                padding: 0 1.5rem;
                background: rgba(255,255,255,0.92);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);

                border-bottom: 1px solid rgba(212, 207, 200, 0.8);

                box-shadow:
                        0 18px 30px -18px rgba(17,16,16,0.10),
                        0 10px 12px -10px rgba(17,16,16,0.06);

                overflow: hidden;

                opacity: 0;
                transform: translateY(-18px) scale(0.98);
                pointer-events: none;

                max-height: 0;
                padding-top: 0;
                padding-bottom: 0;

                transition:
                        opacity 0.4s cubic-bezier(.77,0,.18,1),
                        transform 0.5s cubic-bezier(.77,0,.18,1),
                        max-height 0.5s cubic-bezier(.77,0,.18,1),
                        padding 0.4s ease;
            }

            .nav-center.open {
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;

                max-height: 260px;
                padding-top: 1.8rem;
                padding-bottom: 1.8rem;
            }

            .nav-center li {
                list-style: none;
                opacity: 0;
                transform: translateY(12px);
                transition:
                        opacity 0.35s ease,
                        transform 0.45s cubic-bezier(.77,0,.18,1);
            }

            .nav-center.open li {
                opacity: 1;
                transform: translateY(0);
            }

            .nav-center.open li:nth-child(1) { transition-delay: 0.08s; }
            .nav-center.open li:nth-child(2) { transition-delay: 0.14s; }
            .nav-center.open li:nth-child(3) { transition-delay: 0.20s; }

            .nav-center a {
                font-size: 1rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--black);
                text-decoration: none;
                position: relative;
            }

            .nav-center a::after {
                content: "";
                position: absolute;
                left: 44px;
                bottom: -0.35rem;
                width: 0;
                height: 1px;
                background: var(--black);
                transition: width 0.35s ease;
            }

            .nav-center a:hover::after {
                width: 100%;
            }
        }

        @media (max-width: 820px) {
            .three-cols {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        @media (max-width: 820px) {
            .project-section {
                padding: 3rem 1.5rem;
                gap: 2rem;
            }

            .project-section-body {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        @media (max-width: 820px) {
            .project-process {
                grid-template-columns: 1fr;
                padding: 3rem 1.5rem;
            }
        }

        @media (max-width: 820px) {
            .project-challenge {
                padding: 3rem 1.5rem;
                gap: 3rem;
            }

            .challenge-row {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .challenge-text {
                padding-top: 0;
            }
        }

        @media (max-width: 820px) {
            .project-meta {
                grid-template-columns: 1fr;
                padding: 2rem 1.5rem;
                gap: 2rem;
            }
        }

        @media (max-width: 820px) {
            .project-overview {
                grid-template-columns: 1fr;
                padding: 3rem 1.5rem;
                gap: 1.5rem;
            }
        }

        @media (max-width: 820px) {
            .project-hero {
                padding: 8rem 1.5rem 0;
            }
        }

        /* RESPONSIVE */
        @media (max-width: 820px) {
            nav {
                grid-template-columns: 30px 1fr 30px;
                padding: 1.2rem 1rem;
            }
            .nav-logo { text-align: center }
            footer { padding: 1.8rem 1.5rem; }
        }
        .lang-switcher {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin-right: 0.8rem;

            font-size: 0.7rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .lang-switcher a {
            text-decoration: none;
            color: var(--gray);
            transition: color 0.25s ease;
        }

        .lang-switcher a:hover,
        .lang-switcher a.active {
            color: var(--black);
        }

        .lang-switcher span {
            color: var(--mid);
        }

        /* selector móvil oculto por defecto */
        .mobile-lang {
            display: none;
        }

        /* MOBILE */
        @media (max-width: 820px) {

            /* ocultamos el selector desktop */
            .lang-switcher {
                display: none;
            }

            /* mostramos el del menú */
            .mobile-lang {
                display: flex;
                align-items: center;
                gap: 0.5rem;

                width: 100%;
                margin-top: 0.5rem;
                padding-top: 1rem;

                border-top: 1px solid rgba(212, 207, 200, 0.7);

                font-size: 0.72rem;
                letter-spacing: 0.16em;
                text-transform: uppercase;
            }

            .mobile-lang a {
                text-decoration: none;
                color: var(--gray);
                transition: color 0.25s ease;
            }

            .mobile-lang a.active,
            .mobile-lang a:hover {
                color: var(--black);
            }

            .mobile-lang span {
                color: var(--mid);
            }
        }
    </style>
</head>

  ">
